services:
  app:
    container_name: api-server
    build: .
    command: bash -c "sleep 3 && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./:/usr/src/app
    ports:
      - "8000:8000"
    depends_on:
      postgresql-db:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - location-backoffice-back-network

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  postgresql-db:
    container_name: postgresql-db
    image: postgres:16-alpine
    volumes:
      - ./db/postgresql-data:/var/lib/postgresql/data/
    env_file:
      - .env
    ports:
      - "5432:5432"
    networks:
      - location-backoffice-back-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 3s
      retries: 5


volumes: {}

networks:
  location-backoffice-back-network:
